name: gohard_rebuild
description: "GoHard. Today / Train / Eat / Me."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.1
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter
  sqlite3: ^3.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/scenes/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Page titles only (Today, Train, Eat, Me and secondary page titles), through context.pageTitleStyle.
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
