# flutter gen-l10n (also run by flutter pub get / build because pubspec.yaml sets generate: true).
# English is the complete source catalog; see docs/LOCALIZATION.md.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: false
untranslated-messages-file: build/l10n-untranslated.json
